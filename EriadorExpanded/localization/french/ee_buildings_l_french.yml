l_french:
 
 #building_wonder_tharbad_05:0 "Grand Havre de Tharbad"
#building_wonder_tharbad_05_desc:0 "Tharbad a désormais dépassé même ses gloires passées sous la gouvernance conjointe du Gondor et de l'Arnor. Les vieux remparts de la cité ont été remplacés par de nouvelles fortifications imposantes, et treize puissantes tours ceignent désormais la ville, veillant sur ses rues et ses portes. Le port, autrefois modeste, a été transformé en un vaste havre protégé, tel qu’on n’en a plus vu depuis les grands jours de la colonisation númenóréenne. Les navires marchands venus de toute la Terre du Milieu s’y pressent, leurs voiles arborant les couleurs de contrées lointaines.\n\nÀ l’intérieur des murs, Tharbad prospère comme un centre de commerce, de savoir et de culture. Des halls de marbre et des demeures majestueuses bordent ses larges avenues, tandis que les marchés regorgent de biens venus du Gondor, d’Arnor et d’au-delà. Les érudits se rassemblent dans ses bibliothèques, les artisans s’affairent dans leurs ateliers animés, et des émissaires de royaumes lointains arpentent ses rues. Jadis cité en ruine et en déclin, Tharbad est devenue un joyau étincelant du Nord, témoignage de la force et de l’unité des Royaumes Réunis."

#building_wonder_annuminas_04:0 "Annúminas - Le Phare de l’Ouest"
#building_wonder_annuminas_04_desc:0 "Annúminas s’est élevée de l’oubli et de la ruine pour redevenir le joyau de notre royaume, témoignage de la puissance croissante et de la sagesse des Hommes. Là où jadis des pierres éboulées murmuraient une gloire perdue, une nouvelle Tour se dresse fièrement au-dessus des eaux scintillantes du lac Nenuial, couronnée d’un flambeau dont la lumière ne faiblit jamais. Ce n’est pas une simple flamme, mais une étoile façonnée par la sorcellerie des Hommes, rivalisant avec les œuvres des Elfes d’autrefois. Sa lumière inonde la cité en contrebas, symbole d’un âge où les arts de l’enchantement, jadis domaine exclusif des Premiers-Nés, répondent désormais à la volonté des rois mortels. Les rues, autrefois sombres et silencieuses, brillent aujourd’hui de l’éclat constant des Lampes Fëanoriennes, non plus de rares reliques, mais des merveilles désormais reproduites par l’artisanat des Hommes, illuminant chaque voie de leur éclat froid et brillant.\n\nLes habitants d’Annúminas marchent sous ce jour artificiel, leurs visages levés avec fierté et émerveillement. Longtemps, les Hommes furent jugés inférieurs dans les arts magiques, leurs vies trop brèves pour maîtriser les arcanes du monde, mais ici, cette croyance s’effondre. Nos érudits, forgerons et mages ont uni les savoirs tirés des anciens grimoires et des maîtres elfes, surpassant ce que l’on pensait autrefois impossible. À Annúminas, nous façonnons la lumière elle-même, la pliant, la liant, jusqu’à ce que la nuit fuie devant nous. Ce qui fut jadis le don des mains immortelles est devenu l’héritage de notre peuple. Nous avons reconquis non seulement pierres et terres, mais aussi la merveille, prouvant que les jours des Hommes mortels ne sont plus assombris par l’ombre de leurs aïeux."

#building_wonder_barad_girithlin_02:0 "Cité de Girithlin"
#building_wonder_barad_girithlin_02_desc:0 "Édifiée autour de l’antique forteresse de Barad Girithlin, nous avons élevé une cité fortifiée servant de centre à la restauration du Cardolan et du Sirgala. La ville n’est pas aussi glorieuse que Minas Tirith et la Tour n’est pas aussi puissante qu’Orthanc, mais elle remplit parfaitement son rôle dans la défense du Cardolan."

#building_wonder_nelvorin_02:0 "Grande Bibliothèque de Nelvorin"
#building_wonder_nelvorin_02_desc:0 "Nelvorin a longtemps tenu une place discrète mais vénérée au nord de l’Eriador, connue autrefois comme un phare de savoir et de tradition. Ses anciennes bibliothèques, vastes et labyrinthiques, attiraient jadis des érudits venus de contrées lointaines, leurs rayonnages chargés de tomes relatant la sagesse des Eldar et la profonde histoire des Hommes. Mais avec les siècles, tandis que l’attention du monde se détournait, ces fiers halls tombèrent en ruine, les parchemins pourrissaient, l’encre s’effaçait, et les pierres elles-mêmes se désagrégeaient sous le poids de la négligence. Aujourd’hui, avec un nouvel élan soutenu par le roi et son conseil, Nelvorin renaît. Artisans et scribes œuvrent de concert, restaurant colonnes de marbre et dômes dorés tout en sauvant le savoir qui subsiste. Ces bibliothèques ne seront plus des tombeaux oubliés du savoir, mais des lieux vivants d’étude, dont les portes s’ouvrent à nouveau aux curieux et aux érudits.\n\nGrâce à cette renaissance, Nelvorin est destinée à retrouver sa place de cœur battant du savoir dans le Nord. Déjà, de nouvelles œuvres de recherche et de découverte naissent en ses murs, non pas simples copies du passé, mais créations inédites allant au-delà même des Elfes. Des histoires qu’on croyait perdues sont retrouvées, les langues des jours anciens résonnent à nouveau, et les Hommes rivalisent désormais avec les grands chroniqueurs d’autrefois. Nelvorin n’est pas seulement mémoire de gloire, mais symbole de l’Âge des Hommes, où des mains mortelles façonnent des merveilles de l’esprit, prouvant que la sagesse n’a pas à s’éteindre avec les Elfes, mais peut s’épanouir à nouveau sous la garde humaine."

#building_wonder_caras_celairnen_02:0 "Caras Celarinen - La Cité d’Argent"
#building_wonder_caras_celairnen_02_desc:0 "Caras Celarinen a longtemps tenu une place essentielle dans les réseaux commerciaux de l’Arthedain, sa fortune liée à sa position enviable entre les tours étincelantes d’Annúminas et les ports légendaires des Havres Gris. Nichée au confluent de l’Uialduin et du Lhûn, là où le fleuve rencontre la route et la mer la terre, elle fut autrefois un carrefour animé, lieu d’arrêt des marchands et de passage des voyageurs. Mais aujourd’hui, grâce à une planification soignée et des investissements avisés, Caras Celarinen est passée d’un simple relais à une cité florissante de richesse et de splendeur, rivalisant avec n’importe quelle autre de l’Ouest. Des quais de pierre s’étendent le long des fleuves, de grands ponts franchissent les eaux, et de vastes halls dominent des rues pavées de pierres nettes, témoignage de l’ambition des Hommes et de leur maîtrise grandissante de l’artisanat et du commerce.\n\nSes marchés regorgent de merveilles venues de tout l’Eriador et d’au-delà. Les merveilles elfiques, délicates œuvres de verre, étoffes chatoyantes et enchantements subtils, scintillent aux côtés de la robustesse des créations naines, avec outils ouvragés, gemmes étincelantes et acier solide, échangés à ciel ouvert sous des bannières claquant au vent. Les caravanes venues de l’Est se mêlent aux navires des Havres, leurs marchandises et leurs langues se fondant dans une riche mosaïque de culture et de commerce. Ici, les vieilles rivalités entre peuples cèdent la place au profit et au partenariat, et sur les places bondées de Caras Celarinen, Hommes, Elfes et Nains marchent côte à côte. C’est une cité non seulement de richesse, mais d’ambition, un exemple éclatant de ce que les royaumes des Hommes peuvent accomplir lorsque vision, or et volonté de bâtir se rejoignent."

#building_wonder_carn_dum_02:0 "Minas Aira - La Tour Rouge"
#building_wonder_carn_dum_02_desc:0 "Enfin, Carn Dûm, longtemps le sombre cœur de l’Angmar, est purifiée de son antique mal. Les flèches tordues et les créneaux croulants, tels les serres d’une bête immense assoupie, ont été abattus ou reforgés. Là où les sombres sorcelleries pullulaient, l’air est désormais clair et vif, le ciel n’est plus étouffé par l’ombre. Des mains courageuses ont purgé les tunnels sans fin et les grands halls sous la montagne, scellant les cryptes maudites et détruisant les derniers autels profanes du Roi-Sorcier. À présent, à la place des ruines et de la peur, de nouvelles forteresses s’élèvent, non pas de cruauté, mais de pierre façonnée par l’art mortel et bénie par les sages de la lumière. Des bannières vertes flottent là où jadis s’élevait le sinistre sigil de l’Angmar, et la terre elle-même semble respirer mieux, comme soulagée du poids levé de ses épaules.\n\nPourtant, même dans la victoire, Carn Dûm demeure un lieu sombre et solennel, un monument au prix de la vigilance. Les ossements d’innombrables morts reposent encore sous ses fondations, et le vent porte de faibles échos des horreurs autrefois perpétrées en ses murs. Mais cet héritage ne règne plus ici. Avec le temps, la forteresse servira de tour de guet aux confins des terres sauvages du Nord, rappel que nulle obscurité, aussi ancienne soit-elle, n’est hors de portée du courage des Hommes. Ce qui fut jadis un trône d’ombre est désormais un rempart du royaume, tenu non par la peur, mais par la force et la mémoire de ceux qui osèrent le reconquérir."
 
building_wonder_tradeport_of_hyarmenyalond_01:0 "Ruines de Taurelondë"
building_wonder_tradeport_of_hyarmenyalond_01_desc:0 "Taurelondë, jadis le port elfique florissant de Sirgala, se dressait tel un phare étincelant sur les rivages de l’Ouest, lieu de commerce, de culture et de légendes maritimes. Ses flèches blanches et ses navires gracieux emplissaient les eaux, offrant un havre aux voyageurs en quête de la sagesse des Elfes. Cependant, lorsque les Númenóréens colonisèrent l’Arnor, le port leur fut cédé, et les Elfes se retirèrent en silence, laissant derrière eux leur architecture magistrale.\n\nAvec le temps, à mesure que l’Arnor sombrait dans la ruine, Taurelondë connut le même sort. Le port, jadis animé, repose désormais à l’abandon, livré à la décrépitude. Les bâtiments croulants et les quais oubliés se dressent en silence contre les vents marins, envahis par les ronces et les lierres. La beauté discrète de son dessein elfique subsiste, mais la vie vibrante qui l’animait n’est plus qu’un lointain souvenir, mélancolique rappel d’un âge révolu."
building_type_wonder_tradeport_of_hyarmenyalond_01:0 "Taurelondë"

building_wonder_tradeport_of_hyarmenyalond_02:0 "Taurelondë - Le Havre des Forêts"
building_wonder_tradeport_of_hyarmenyalond_02_desc:0 "Après des siècles de silence, l’Arnor est revenu pour reconquérir l’antique port de Taurelondë. Longtemps abandonnée et oubliée, la cité renaît aujourd’hui sous l’étendard du Royaume du Nord. Les flèches délabrées et les quais en ruine sont soigneusement restaurés, et la mer résonne à nouveau des bruits des navires en approche. Des artisans habiles et des ouvriers infatigables redonnent vie à la grande architecture du port, mêlant l’artisanat númenóréen à l’élégance des formes elfiques encore présentes dans la cité.\n\nLa revitalisation de Taurelond marque une nouvelle ère pour l’Arnor, alors que la cité redevient un centre majeur de commerce et de culture dans le Nord. Les docks grouillent à nouveau de navires chargés de marchandises et de voyageurs venus de terres lointaines, tandis que les rues se remplissent de marchands, d’érudits et de marins. Bien que les ombres de son long abandon persistent encore, Taurelond renaît lentement, symbole de la vigueur retrouvée de l’Arnor et passerelle vers l’héritage ancien des Elfes."

#building_wonder_edhelas_01:0 "Halls en ruine d’Edhelas"
#building_wonder_edhelas_01_desc:0 "Les Halls d’Edhelas se dressent dans une solennelle majesté sur les rivages embrumés du sud-est, non loin des Havres Gris, dissimulés parmi les antiques forêts de Sirgala. Construits à flanc de colline et harmonieusement liés à la nature environnante, ils sont un chef-d’œuvre d’architecture elfique, élégants et durables, alliant pierre, bois et argent dans une parfaite symbiose. Ces halls furent jadis la demeure orgueilleuse du roi Bornmir, dernier souverain de Sirgala, dont le règne fut marqué par la sagesse et la grâce avant le déclin des Elfes vers l’Ouest. À l’intérieur, des tapisseries racontant les gloires anciennes de Sirgala tapissent les murs, et l’air conserve encore le parfum mêlé de la mer et des fleurs des bois.\n\nBien qu’abandonnés depuis le départ de Bornmir, les Halls d’Edhelas conservent l’aura d’une cour jadis vivante. La douce lumière des étoiles filtre par de hautes fenêtres en arc, projetant une clarté sereine sur les sols polis et les gravures délicates. Dehors, les jardins semblent préservés du temps, où arbres séculaires et lianes fleuries s’entrelacent autour des colonnes de pierre. Les halls subsistent comme un monument silencieux au dernier roi elfe, lieu de paix et de recueillement, où résonnent encore les échos du passé de Sirgala et où demeure la sagesse des Elfes, en attente de ceux qui viendront la chercher."
#building_type_wonder_edhelas_01:0 "Halls d’Edhelas"

#building_wonder_edhelas_02:0 "Halls d’Edhelas restaurés"
#building_wonder_edhelas_02_desc:0 "Les Halls d’Edhelas resplendissent à nouveau sous la garde des Elfes, tandis que l’antique demeure du roi Bornmir est reconquise et renouvelée par ceux qui ont retrouvé les rivages de Sirgala. Les salles autrefois silencieuses résonnent à nouveau des voix elfiques et des sons délicats des harpes. Les jardins, jadis sauvages, ont retrouvé splendeur et harmonie, leurs arbres séculaires ornés de fleurs et de fruits. Les halls, méticuleusement restaurés, rayonnent de leur pierre éclatante et de leurs gravures raffinées, reflet de la grâce et de la beauté intemporelle des Elfes qui y vivent désormais.\n\nLà où régnaient jadis les ombres de l’abandon, brûle à présent la chaleur d’une cour vivante. La lueur argentée filtre à travers les hautes fenêtres, illuminant des salles baignées par l’éclat des lampes elfiques. Dans les vastes chambres, les bannières de Sirgala flottent à nouveau, leurs fils d’or captant la lumière des étoiles. L’air s’emplit du parfum des fleurs écloses et de la brise salée de la mer, se mêlant aux chants des voix elfiques qui résonnent entre les murs, comme si la terre elle-même s’éveillait au retour de son peuple. Les Halls d’Edhelas ne sont plus seulement le souvenir d’un âge révolu, ils sont redevenus le cœur battant de Sirgala, un phare de l’héritage elfique et un espoir pour l’avenir, où la sagesse du passé rencontre les rêves d’un nouveau commencement."

building_wonder_angle_of_eriador:0 "L’Angle de l’Eriador"
building_wonder_angle_of_eriador_desc:0 "L’Angle de l’Eriador se tient comme une forteresse isolée, terre de force tranquille et d’héritage tenace, où les Dúnedain dispersés d’Arnor trouvèrent refuge après la chute de leur ancien royaume. Nichée entre collines balayées par les vents et rives des fleuves du Nord, cette région reculée est devenue le havre des derniers Dúnedain, lieu où leur antique lignée se perpétue en secret, dissimulée aux ténèbres croissantes du monde. Les ruines de l’Arnor, lointaines mais toujours présentes, leur rappellent leur héritage perdu, et pourtant les Dúnedain demeurent fidèles à leur devoir, préservant la mémoire de leur royaume dans le silence des terres sauvages.\n\nPeu peuplé, l’Angle n’en est pas moins riche de son histoire et de sa fierté. Les Dúnedain y ont bâti leurs foyers parmi les bois anciens et les plaines vallonnées, élevant des fortins et des tours de guet pour se prémunir de la menace constante des Orques et des forces des ténèbres. Les grandes bannières du Nord ne flottent plus au-dessus des murailles des cités, mais les cœurs de ces Hommes brûlent d’un feu discret — que le temps ne saurait éteindre. Cachés dans la solitude des terres reculées de l’Angle, les Dúnedain veillent, préservant le savoir de leurs ancêtres, sauvegardant la lignée des rois et surveillant les frontières de l’Eriador. Bien que le monde les ait oubliés, ils demeurent un témoignage vivant de la résilience des Dúnedain, sentinelles silencieuses de l’héritage déclinant de l’Arnor, prêtes à se relever lorsque l’heure l’exigera."
building_type_wonder_angle_of_eriador:0 "L’Angle de l’Eriador"

#building_wonder_minas_formen_01:0 "Minas Formen"
#building_wonder_minas_formen_01_desc:0 "Minas Formen, la Tour du Nord, se dresse avec résolution face aux vents du temps et aux rigueurs des éléments qui frappent le Rhudaur depuis sa construction. Édifiée par les Hommes d’Arnor pour protéger le royaume des assauts de l’Angmar, la tour fut jadis le cœur d’une grande forteresse, ses murs de pierre s’élevant haut au-dessus des plaines et forêts du Nord. Bien que le royaume du Rhudaur soit tombé depuis longtemps sous l’ombre de l’Angmar, Minas Formen demeure, monument silencieux de la détermination inébranlable de ceux qui l’habitèrent jadis. Son architecture, unique parmi les tours anciennes, fut conçue à la fois pour la défense et la longévité, avec de profondes fondations ancrées dans la roche et de larges courbes pensées pour résister aux sièges comme aux tempêtes.\n\nLes siècles ont passé, et ce bastion jadis grouillant de vie se tient aujourd’hui comme un sentinelle solitaire sur la désolation du Rhudaur. Pourtant, sa force reste intacte : ses hauts murs, ses fenêtres ouvragées et ses vastes cours ont résisté aux âges, et ses escaliers secrets en spirale serpentent encore vers les hauteurs, offrant une vue imprenable sur les terres alentours. Là où d’autres forteresses se sont effondrées, l’ingéniosité de Minas Formen lui a permis de perdurer, ses pierres antiques marquées mais intactes. Aujourd’hui, bien que les royaumes d’autrefois aient disparu, la tour subsiste comme un vestige d’un âge révolu, un gardien silencieux du Nord, survivant à travers les millénaires, témoignage de la force de ses bâtisseurs et de la vaillance de ses derniers défenseurs."
#building_type_wonder_minas_formen_01:0 "Minas Formen"

building_wonder_mirdairond_human:0 "Ost-in-Edhil"
building_wonder_mirdairond_human_desc:0 "La nouvelle cité d’Ost-in-Edhil se dresse comme une grandiose fusion entre l’élégance elfique et la force númenóréenne, ses hautes flèches s’élançant vers le ciel, désormais renforcées par la maçonnerie solide d’Arnor. La cité autrefois en ruines a renaît avec de larges rues majestueuses bordées de bâtiments en pierre blanche, chacun témoignant à la fois de l’art ancien et de la puissance durable des Hommes. Hautes arches, sculptures délicates et fenêtres ciselées dans le style elfique se marient avec les murs imposants et les fortifications de facture númenóréenne. De grandes salles et des tours de guet dominent désormais l’horizon, leurs silhouettes se découpant dans la brume, tandis que de vastes cours ornées de statues et de fontaines rappellent l’élégance de la cité elfique qui s’élevait jadis en ce lieu. La cité vibre de vie, incarnation fière de l’antique merveille, un phare de la puissance d’Arnor, bâti pour résister à l’épreuve du temps."
building_type_wonder_mirdairond_human:0 "Ost-in-Edhil"

building_wonder_fort_arlas_01:0 "Fort Arlas"
building_wonder_fort_arlas_01_desc:0 "Fort Arlas est une forteresse défensive robuste, construite par les rois du [rhudaur|e] afin de protéger les approches de l’[angmar|e]. Cela en fit une cible de choix dès les premiers jours des guerres d’Angmar. Après le conflit, la forteresse tomba en ruine, jusqu’à ce que les [dunedain|e] la restaurent en poste de garde et relais après la bataille de Greenfields."
building_type_wonder_fort_arlas_01:0 "Fort Arlas"

building_type_wonder_shrouded_isles_01:0 "Îles Voilées de Nenuial"
building_wonder_shrouded_isles_01:0 "Îles Voilées de Nenuial"
building_wonder_shrouded_isles_01_desc:0 "Depuis que les Hommes vivent sur ses rives, une magie plane sur les brumeuses îles du lac Evendim. Nul n’en connaît l’origine : certains y voient un artifice [elven|e], d’autres l’œuvre d’une sombre sorcellerie du [witchking|e]. Mais les îles restent plongées dans un brouillard presque permanent, troublant navigateurs et pêcheurs, et inspirant à tous ceux qui s’en approchent un vague malaise."
building_wonder_shrouded_isles_02:0 "Les Salles Flottantes de Nenuial"
building_wonder_shrouded_isles_02_desc:0 "Construites à l’origine par les Sindar fuyant la [warofwrath|e], les Salles Flottantes furent édifiées sur un archipel au large de Nenuial. Elles se composaient d’une série de bassins et de ponts jetés sur l’eau, une partie des structures flottant à la surface, le reste ancré dans le lit du lac. Lors du séjour de Dame Galadriel, elle envoûta les îles d’une brume destinée à désorienter ses ennemis et protéger le site du [darklord|e]. Mais ses efforts furent vains : les salles furent détruites et la plupart des îles anéanties au cours de la [waroftheelvesandsauron|e]."

building_type_wonder_gondolin_01: "Gondolin"
building_wonder_gondolin_01: "La Cité Engloutie de Gondolin"
building_wonder_gondolin_01_desc: "La Cité Cachée de [gondolin|e] était l’un des plus vastes et puissants royaumes [noldor|e] des [elderdays|e]. Détruite par [morgothcharacter|e] durant la Guerre des Joyaux, ses ruines furent englouties avec la majeure partie de [beleriand|e] à la fin du [firstage|e]. Elle repose au large de la côte sud-ouest de Tol Fuin."

building_wonder_gondolin_02: "Gondolin Resplendissante"
building_wonder_gondolin_02_desc: "[gondolin|e] est restée sous la mer pendant des millénaires innombrables, mais après d’immenses travaux de dragage et de remblaiement, la Cité Cachée a été relevée des profondeurs. Bien que les montagnes environnantes aient été détruites lors de la [warofwrath|e], les murs blancs étincelants de la cité dominent désormais la grande mer. Gondolin redevient un centre de la culture elfique et un symbole de l’endurance des Eldar en Terre du Milieu."

building_type_wonder_wadewater: "Le Gué des Eaux"
building_wonder_wadewater: "Le Gué des Eaux"
building_wonder_wadewater_desc: "Ancienne colonie des Hobbits des Stoors installés au Marais des Cygnes avant la fondation de la [shire|e], elle constitue un centre de la culture [hobbit|e] en dehors de notre foyer et une base idéale pour l’expansion."
