### Artéfacts
ring_manual: "Enseignements de Celebrimbor"
ring_manual_desc: "Recueil des enseignements du grand forgeron [celebrimbor|e] rédigé avant la chute d’[eregion|e], contenant tout ce qu’il apprit de [annatarcharacter|e] et la formule pour forger les [ringsofpower|e]."

new_ring_name: "Anneau de [owner.GetFirstNameNoTooltip]"
new_ring_description: "@warning_icon!#T Ne faites pas confiance à vos sens : la magie des [ringsofpower|E] change selon la race de son porteur.#!\n\nUn véritable miracle de la forge elfique. Un nouveau [ringofpower|e] forgé bien après la chute d’[eregion|e]. [owner.GetFirstName] étudia longuement le travail de [celebrimbor|e] afin de reproduire cet art sans l’aide de [sauroncharacter|e]. Seul le temps dira si cet anneau est exempt de l’ombre."

