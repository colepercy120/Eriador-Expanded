 ### Elf

ee_elf.05.t:0 "Nenuial Reprise !"
ee_elf.05.desc:0 "Les rivages de Nenuial, autrefois honorés par la présence de la Dame Galadriel, étaient silencieux depuis de longues années, leur beauté enfouie sous le poids du temps. Les ruines d’Annúminas, jadis cœur du Royaume d’Arnor, gisent désormais en décomposition, ombre d’une gloire humaine destinée à périr. Les pierres laissées par les hommes rappellent leur passage éphémère, mais le chant elfique s’élève à nouveau, alors que nous revenons sur ces rivages où Galadriel marchait.\n\nNous ne venons pas pour préserver les vestiges des royaumes mortels, ni pour honorer des ruines dénuées de sens. Non, nous venons pour dissiper ce qui n’a pas sa place dans l’avenir de cette terre. Leurs murs brisés, leurs routes fanées—ce ne sont que des échos d’un âge révolu. Nous les balaierons, car ils n’étaient jamais destinés à perdurer.\n\nÀ leur place, nous construirons un royaume digne des étoiles, aussi intemporel et éternel que les Elfes eux-mêmes. Les terres de Nenuial brilleront de nouveau, phare de lumière et de grâce. L’héritage de Galadriel, qui a marché sur ces rivages, sera honoré non par des vestiges, mais par la création d’un royaume elfique qui brillera pour tous les âges à venir."
ee_elf.05.a:0 "Une aube nouvelle pour les rivages au clair de lune"

ee_elf.06.t:0 "Le Haut Royaume d’Eriador"
ee_elf.06.desc:0 "Pendant des âges, [eriador|e] fut l’un des plus grands et puissants royaumes elfique de la Terre du Milieu. Protégé à l’ouest par les Ered Luin et à l’est par les Hithaeglir, Eriador fut longtemps une terre juste et paisible des [eldar|e]. Cependant, il fut détruit lors de la [waroftheelvesandsauron|e] et donné aux Dúnedain après la chute.\n\nMais ce n’est plus le cas ! L'Eriador résonne à nouveau de chants elfique et de champs fleuris. Les forêts s’avancent sur les plaines longtemps stériles, [eregion|e] renaît tel un phénix, un nouveau printemps atteint [GetTitleByKey('k_sirgala').GetNameNoTier] et les rivages au clair de lune de [GetTitleByKey('k_nenuial').GetNameNoTier] sont à nouveau immaculés. Eriador est redevenu elfique !"
ee_elf.06.a:0 "Et il ne tombera plus jamais !"

ee_elf.07.t: "Lórien Occidental"
ee_elf.07.desc: "Depuis longtemps, [eregion|e] gisait abandonnée. Depuis la [waroftheelvesandsauron|e], ma seconde patrie n’était plus que ruines, mais cela change aujourd’hui ! Avec la maîtrise du passage et la restauration du royaume, il est enfin temps de fusionner ces deux royaumes et ces deux peuples en un seul."
ee_elf.07.a: "Pour l’éternité à venir."

ee_elf.08.t: "Gondolin restaurée !"
ee_elf.08.desc: "Depuis la [warofwrath|e], [gondolin|e] reposait abandonnée au large de Tol Fuin. Deux âges entiers du monde ont vu la cité demeurer en ruines. Mais cela n’est plus ! Gondolin, la Cité Cachée, et l’[hope|e] de tous les [eldar|e], renaît !\n\nAprès des années de travaux pour draguer les ruines et reconstruire la terre même sur laquelle elle repose, Gondolin est à nouveau emplie de chants elfiques ! Et bien que les Montagnes Enceintes aient disparu, c’est désormais la Grande Mer elle-même qui protège la cité."
ee_elf.08.a: "Une déclaration de notre endurance dans un monde en perpétuel changement !"

ee_elf.09.t: "L’Union de [root.GetFirstName]"
ee_elf.09.desc: "Trop longtemps les [eldar|e] ont été divisés. Depuis la [greatjourney|e], les Elfes de l’Ouest se sont fragmentés. Mais au fil des millénaires, les différents clans elfiques se sont mêlés et entremêlés. Il n’a plus de sens qu’il existe un Haut Roi des [noldorelves|e] ou des [sindarelves|e] : il est temps qu’il n’y ait plus qu’un seul Haut Roi de tous les Eldar !"
ee_elf.09.a: "Une nouvelle ère pour notre peuple !"

ee_elf.1000.t:0 "La Restauration de l'Eregion"
ee_elf.1000.desc:0 "La terre de [eregion|e] est demeurée trop longtemps abandonnée. Par la puissance de [primarytitle.GetNameNoTier], elle a été purifiée et rendue habitable à nouveau. Il est maintenant temps d’envoyer nos émissaires aux [noldorelves|e] et de désigner un nouveau seigneur pour gouverner ces terres."
ee_elf.1000.a:0 "Envoyez un message à [elrond.GetName], le plus sage des [noldorelves|e]."
ee_elf.1000.b:0 "Envoyez un message à [galadriel.GetName], l’une des dernières survivantes de l'Eregion."
ee_elf.1000.c:0 "Envoyez un message à [maglor.GetName], le dernier fils de [feanor|e]."
ee_elf.1000.d:0 "Laissez les Elfes choisir un chef parmi eux."
eregion_message1:0 "Envoyez un message à [elrond.GetFirstName]."
eregion_message2:0 "Envoyez un message à [galadriel.GetFirstName]."
eregion_message3:0 "Envoyez un message à [maglor.GetFirstName]."
 
ee_elf.1001.t: "La restauration de l’Eregion"
ee_elf.1001.desc: "Depuis de nombreuses années, les terres de [eregion|e] sont en ruines. Depuis la [waroftheelvesandsauron|e], le pays des Forgeurs d'Anneaux est resté à l’abandon. Mais cela n’est plus ! [eregion_restorer.GetName], par un immense labeur, a restauré cette terre perdue et, chose plus étrange encore, m’a proposé d’en devenir le seigneur."
ee_elf.1001.a: "Rallumons les forges !"
ee_elf.1001.b: "Je serai le seigneur de l’Eregion et rien d’autre."
ee_elf.1001.c: "Je ne peux abandonner mon foyer pour régner sur une terre maudite."

 ee_elf.2000.t:0 "Rage contre le Déclin de la Lumière"
ee_elf.2000.desc:0 "Pourquoi les Eldar devraient-ils se cacher dans les forêts et montagnes du monde comme des fantômes d’un âge oublié ? Pourquoi nous, les Premiers-Nés d’Ilúvatar, devrions-nous fuir la lumière et abandonner l’héritage de notre passé, simplement parce que les ombres du mal ont connu la victoire ? La chute d’Eregion fut une blessure amère, oui, mais ne sommes-nous pas plus grands que notre peine ? La race des Hommes ne s’est-elle pas relevée des cendres de Númenor, forgeant royaumes et destinées malgré sa mortalité ?\n\nDevons-nous, qui avons vu les Deux Arbres fleurir et dépérir, qui avons marché sous les étoiles avant que le Soleil et la Lune ne naissent, désormais nous terrer dans des clairières cachées, attendant que le monde nous dépasse ? Pourquoi rester en silence, derrière des murs de marbre et des salles chargées de mémoire, tandis que le monde change sans nous ?\n\nNon. Je dis que nous ne sommes pas des reliques. Nous ne sommes pas le chant déclinant. Le feu de notre esprit brûle encore. Rappelons-nous qui nous sommes, non dans le deuil, mais avec un but. Que les vents portent nos voix à nouveau. Que le monde voie que les Eldar n’ont pas disparu : nous perdurons ! Et peut-être, nous nous élèverons de nouveau."
ee_elf.2000.a:0 "Nous ne nous tairons pas !"

ee_elf.2001.t:0 "Une Découverte Chanceuse"
ee_elf.2001.desc:0 "Nous n’avions exploré les ruines de l’[eregion|e] que depuis peu lorsque l’un de nos compagnons s’écria. Elle avait fouillé les anciennes forges et découvert une alcôve cachée dans le mur d’une des smithies. Derrière une brique détachée se trouvait non seulement un ensemble d’outils de forge, mais aussi un ancien manuel. En le feuilletant, je réalisai qu’il s’agissait des Enseignements de [celebrimbor|e] ! Apparemment, ce forgeron ne voulait pas que quiconque sache qu’il consultait ce livre. Mais ce trésor caché pourrait bien expliquer pourquoi les [eldar|e] n’ont jamais perdu l’art de la forge des anneaux !\n\nIl ne reste plus qu’à décider de notre prochaine étape, rechercher les survivants de l’Eregion à [imladris|e] ou solliciter l’aide du Magicien Blanc, [sarumancharacter|e]."
ee_elf.2001.a:0 "Vers Imladris !"
ee_elf.2001.b:0 "Allons trouver le Magicien Blanc !"
ee_elf.2001.c:0 "Nous n’avons besoin de personne !"
ee_elf.2001.a.effect:0 "Voyage vers Imladris"
ee_elf.2001.b.effect:0 "Voyage vers Sarouman"

ee_elf.2002.t:0 "Le Dernier Forgeron"
ee_elf.2002.desc:0 "[imladris|e] est un lieu étrange, la Maison du Dernier Foyer à l’ouest des Montagnes Brumeuses. Tout ce que j’y vois, c’est le potentiel perdu. C’est là que se sont réfugiés les [eldar|e] après la [waroftheelvesandsauron|e] ? Cette vallée cachée dans les montagnes ? Triste état pour notre peuple.\n\nMais j’ai une tâche à accomplir. Imladris abrite les survivants de l’[eregion|e] et les Forgeurs d’Anneaux. Avec un peu de chance, je trouverai un forgeron survivant ayant l’expérience directe de la création des anneaux de pouvoir. Après quelques recherches, je trouvai [smith.GetFirstName]. Il prétend être le dernier forgeron des Noldor, mais affirme avoir perdu tout espoir pour l’avenir de la Terre du Milieu."
ee_elf.2002.a:0 "Voyons si je peux le convaincre du contraire."
ee_elf.2002.a.success:0 "Vous le convainquez"
ee_elf.2002.a.failure:0 "Vous échouez à le convaincre"

ee_elf.2003.t:0 "Le Magicien Blanc"
ee_elf.2003.desc:0 "Je me tiens devant le Magicien Blanc [sarumancharacter|e], l’un des cinq [istariconcept|e] envoyés par les [valargods|e] pour guider les peuples de la Terre du Milieu, avec une demande inhabituelle. Le Magicien Blanc fut autrefois un [maiargods|e] de [aulecharacter|e], réputé pour son talent exceptionnel. Si quelqu’un peut reproduire l’aide que [sauroncharacter|e] donna à Celebrimbor, c’est bien lui. On dit même qu’il entreprit un projet similaire pour comprendre les [ringsofpower|e] et contrer les [oneringshort|e]."
ee_elf.2003.a:0 "Voyons si nous pouvons parvenir à un accord."
ee_elf.2003.a.success:0 "Vous parvenez à un accord"
ee_elf.2003.a.failure:0 "Vous échouez à parvenir à un accord"
ee_elf.2003.a.effect:0 "Saruman accepte de vous aider"

ee_elf.2004.t:0 "Un Nouvel Anneau"
ee_elf.2004.desc:0 "Le moment est enfin venu de forger un nouvel anneau de pouvoir ! Nous avons rassemblé les matériaux, effectué de nombreux tests et pratiqué chaque étape selon les méthodes de [celebrimbor|e], jusqu’à la perfection, car cette tâche exige la perfection. Sinon, quelqu’un d’autre l’aurait accomplie il y a des millénaires. Il est temps de montrer au monde que les [eldar|e] ne sont pas un peuple déclinant, mais qu’ils existent encore et se battent pour protéger ce monde !"
ee_elf.2004.a:0 "Allumez les Forges"
ee_elf.2004.a.success:0 "Un Anneau est Forgé"
ee_elf.2004.a.failure:0 "Le Projet échoue"

ee_elf.2005.t:0 "Face à la Tour Noire"
ee_elf.2005.desc:0 "'Sors et affronte-moi !' criai-je vers la tour insondable et j’attends une réponse. Le regard de l’Œil sans Paupière me scrute depuis le sommet, mais je tiens bon. Je suis l’espoir des Peuples Libres ! Je suis la Flamme de l’Ouest ! Je prouverai une bonne fois pour toutes que les [eldar|e] sont toujours aussi grands qu’aux [elderdays|e]. Je vais tuer [sauroncharacter|e] ! Mon regard se reporte sur la porte qui s’ouvre et le Seigneur des Terres Noires apparaît…"
ee_elf.2005.a:0 "Je vengerai mes ancêtres !"
ee_elf.2005.b:0 "Peut-être est-ce une mauvaise idée ?"
ee_elf.2005.c:0 "#italic Salut Annatar, Seigneur des Anneaux ! #!"
ee_elf.2005.a.success:0 "Le Seigneur Noir tombe sous votre lame"
ee_elf.2005.a.failure:0 "Sauron vous écrase de son marteau"
ee_elf.2005.b.success:0 "Vous vous échappez"
ee_elf.2005.c.success:0 "Vous résistez à l’Anneau"
ee_elf.2005.c.failure:0 "Vous succombez à l’Anneau"

### Hobbit

ee_hobbit.0100.t: "Notre déclaration d’indépendance"
ee_hobbit.0100.desc: "La [shire|e] est légalement un royaume subordonné au [northkingdom|e] depuis plus d’un millénaire. Cependant, depuis la destruction d’Arnor, il n’y a plus de roi. Pourquoi maintenir la fiction selon laquelle nous sommes une province d’Arnor, alors qu’il ne reste plus rien d’Arnor auquel nous pourrions appartenir ? Il est temps d’en finir avec cela et de rendre la Comté véritablement indépendante."
ee_hobbit.0100.a: "Nous tenons debout par nous-mêmes !"

ee_hobbit.0101.t: "La Grande Comté"
ee_hobbit.0101.desc: "La [shire|e] a longtemps été la seule région habitée de [eriador|e], dernier bastion de civilisation dans les terres désolées. Bien que nous n’ayons à l’origine reçu que les terres de la Comté, personne n’a contesté notre présence depuis des siècles. Il est temps d’étendre notre autorité sur ces terres jusqu’aux frontières de l’Eriador !"
ee_hobbit.0101.a: "Que les terres désolées refleurissent !"

ee_hobbit.0102.t: "La restauration du Gué des Eaux"
ee_hobbit.0102.desc: "Le Gué des Eaux, l’ancienne patrie des Hobbits Stoors, a été restaurée. Des terres restées vides pendant des siècles sont à nouveau remplies de l’odeur du tabac à pipe et du son des rires. Des Hobbits de la [shire|e] affluent déjà vers ce nouveau domaine, et des routes commerciales à travers [eriador|e] ont déjà été établies. Il est désormais temps de proclamer officiellement la théocratie du Gué des Eaux !"
ee_hobbit.0102.a: "Un nouveau foyer !"

### Easter Egg

# ee_arnor.5000.t: "Les Fidèles du Sud !"
# ee_arnor.5000.desc: "[ROOT.Char.GetFirstName] était le dernier rejeton d’une maison [arnorian|e] presque éteinte, ayant fui la Grande Peste. Au début de l’an 2752 du [thirdage|e], elle et son époux [ROOT.Char.GetPrimarySpouse.GetFirstName], un prince [adunai|e] ayant passé la majeure partie de son enfance sur des navires marchands entre [thanihazad|e] et [gondor|e], et devenu fervent des [faithful|e], furent envoyés en [thanihazad|e] par le Sénéchal de [gondor|e] dans le but de convertir les [adunai|e] et de tenter de les rallier contre le [darklord|e]. Ils arrivèrent dans le pays natal de [ROOT.Char.GetPrimarySpouse.GetFirstName], à [GetTitleByKey('d_inzilloni').GetNameNoTier], avec une armée de volontaires gondoriens et une volonté ardente de libérer les terres de l’Extrême Sud !"
# ee_arnor.5000.a: "L’espoir n’est pas perdu !"

gondorian_host: "Armée gondorienne"
