 ### Arnor 
 
ee_arnor.1.t:0 "Intégration des provinces du Sud"
ee_arnor.1.desc:0 "Enfin, les terres sauvages d’Enedwaith et de Dunland sont désormais sous le contrôle ferme et juste de l'Arnor. Trop longtemps, ces collines escarpées et ces vallées ombragées ont abrité des tribus d’hommes des collines indisciplinés, infidèles et querelleurs, dont les loyautés changeaient comme les vents de la montagne. Aujourd’hui, les bannières du Royaume du Nord flottent fièrement sur leurs forteresses de pierre et leurs vallons boisés. L’ordre est rétabli là où régnait le chaos, et la paix du Roi s’étend des Barrows au Greyflood. Ce n’est pas une simple conquête, c’est une réappropriation, l’accomplissement du devoir ancien de l'Arnor, dompter ces frontières sauvages et guider ces peuples égarés vers la lumière de la civilisation. Que l’on sache dans toutes les terres de l'Eriador et au-delà, Enedwaith et Dunland témoignent de la force durable d’Arnor ! Les chefs des collines, jadis fiers et rebelles, s’inclinent désormais devant le trône, jurant fidélité sur l’acier et la pierre. Routes seront tracées, forteresses élevées, et la langue de l’Ouest résonnera dans des terres longtemps muettes à notre voix. Le sauvage reculera, la terre sera fertile sous notre main, et la justice du Roi règnera sans conteste. Ainsi, l’héritage d’Elendil est renouvelé et la gloire du Royaume du Nord brille toujours plus."
ee_arnor.1.a:0 "Du Gwathló à l’Isen, le Sud est à nous !"

ee_arnor.2.t:0 "La Reconquête d’Eregion"
ee_arnor.2.desc:0 "Par un labeur inflexible, des sacrifices et la détermination de notre peuple, l’ancien royaume oublié d’Eregion se dresse à nouveau, prospérant désormais au sein des frontières d’Arnor. Il n’est plus uniquement le domaine ancien des elfes : il constitue désormais une part intégrante et vivante de notre royaume. La bannière d’Arnor flotte fièrement sur Eregion, et le monde doit reconnaître qu’elle nous appartient autant que n’importe quelle autre terre de notre royaume."
ee_arnor.2.a:0 "Déclarer Eregion comme partie d’Arnor"

ee_arnor.3.t:0 "La Cession d’Orthanc"
ee_arnor.3.desc:0 "Dans un moment de grande importance, la forteresse d’Orthanc, l’ancienne tour de l’Isen, passe aux mains de l'Arnor. Jadis bastion de Gondor, elle s’élevait comme sentinelle dans les confins du Sud de la Terre du Milieu, ses murs de pierre noire veillant sur le Goulet de Rohan et les terres tumultueuses à l’Ouest. Aujourd’hui, avec le retrait de Gondor et le changement des forces, la forteresse est formellement remise à notre royaume. La puissance de la tour, sa position stratégique et son rôle ancien comme bastion défensif serviront désormais les intérêts d’Arnor comme jamais auparavant. Le Palantír d’Orthanc, trésor d’une valeur inestimable, est désormais entre nos mains, un phare de savoir et de puissance qui guidera l’avenir de l'Arnor comme il a façonné le passé de la Terre du Milieu. Nous contrôlerons les vents de la fortune, les orientant vers la prospérité de notre peuple et la sécurité de nos frontières. Orthanc n’est plus le symbole du déclin de Gondor, elle devient une pierre angulaire du règne d’Arnor, une tour inébranlable au cœur de notre domination grandissante. De ses hauteurs, nous veillerons sur le pays, et de ses profondeurs, nous apprendrons les secrets du monde. L’avenir est à nous."
ee_arnor.3.a:0 "Orthanc appartient désormais à Arnor, quel nouveau pouvoir tirerons-nous de ses anciennes salles ?"

ee_arnor.5.t: "Le Retour du Roi"
ee_arnor.5.desc: "Avec le retour tant attendu du Roi d’Arthedain, une nouvelle nous est parvenue du Nord. Un émissaire, vêtu des armoiries de l’ancienne Arnor, s’est présenté porteur du sceau royal et de ses paroles solennelles. Il ne parle ni en menaces ni en ordres, mais avec le poids des liens anciens et la force tranquille d’un souverain revenu sur son trône légitime. Dans sa main, il tient un parchemin de fine facture, dont l’écriture rappelle les serments jadis prêtés par nos ancêtres. Il nous appelle aujourd’hui à nous souvenir de ces promesses faites aux jours de nos aïeux, à redevenir les protecteurs des terres qui nous furent confiées, et à veiller sur la Comté, ce coin paisible du monde souvent ignoré, mais cher au cœur du Nord. L’émissaire demande que nous restaurions nos serments envers la cité d’Annúminas, antique siège des rois de l'Arnor, désormais relevée de ses ruines par la main du roi. Il nous exhorte à surveiller les frontières de la Comté, afin de la protéger de toute ombre ou menace qui viendrait troubler sa paix. Ce n’est pas seulement un appel aux armes, mais une convocation à l’honneur, à reprendre le devoir que portaient nos pères, et à nous souvenir des anciennes alliances qui ont façonné notre peuple. Un temps de réflexion nous est accordé, mais le message est clair, le Nord s’éveille à nouveau, et avec lui renaît le souvenir de ce qui fut perdu, et de ce qui pourrait encore être restauré."
ee_arnor.5.a: "Jurer fidélité"
ee_arnor.5.b: "La Comté n’a pas besoin de roi"

ee_arnor.6.t:0 "La Récupération des Palantíri"
ee_arnor.6.desc:0 "L’équipe de récupération mit les voiles sous un soleil pâle et fatigué, son cap dirigé vers les eaux agitées et glaciales des régions les plus désolées de Forochel. Pendant des semaines, leurs efforts n’avaient produit que la côte rocheuse et gelée et le murmure du vent dans le silence. Mais ce matin, alors que l’équipage lançait ses filets sur les eaux où les courants étaient encore plus froids, la mer offrit un sombre trésor. Sous les vagues sombres, l’épave de l’Arvedui, le légendaire navire du dernier Roi d’Arthedain, gisait entre les rochers acérés, sa coque brisée mais tenant encore, défiant le temps, les secrets de son dernier voyage. Pour les hommes à bord, la vue de l’épave fut un mélange de crainte et d’émerveillement, à la fois triomphe de la découverte et rappel des périls que la mer a pris. Les plongeurs, désormais prudents face aux profondeurs impitoyables, bravèrent les eaux glaciales avec une seule mission : récupérer le Palantír perdu.\n\nLes heures passèrent dans un silence tendu, seulement brisé par le grincement du navire et le fracas des vagues lointaines. Puis, dans un effort défiant l’océan lui-même, la première pierre refit surface — sombre, lisse et ancienne, sa surface de verre brillant étrangement sous la pâle lumière. Le Palantír d’Annúminas était retrouvé, ses mystères préservés dans l’étreinte froide de la mer. La seconde suivit bientôt, pierre d’égal âge mais déformée par le temps, le Palantír d’Amon Sûl. Leur récupération fut une victoire non seulement pour l’équipe, mais pour le royaume lui-même, car ces pierres portaient désormais la promesse de restaurer la vision d’Arnor, si le Roi osait les utiliser. À leur retour sur la terre ferme, le poids de l’histoire sembla se déplacer, et l’ombre lointaine du passé commença à s’éveiller à nouveau."
ee_arnor.6.a:0 "Hourra !"
 
ee_arnor.4000.t:0 "Le Jeu des Nombres"
ee_arnor.4000.desc:0 "Le Balrog de Moria est une menace comme aucune autre. Ancien Maiar déchu et serviteur de Morgoth depuis le commencement de la Grande Musique, il se situe dans une classe bien au-delà de tout être vivant en Terre du Milieu aujourd’hui, à l’exception du Seigneur des Ténèbres lui-même. Nous ne sommes que des fourmis face à sa puissance. Mais les fourmis peuvent abattre même le plus puissant guerrier, à condition d’avoir une stratégie adaptée. \n\nEn aménageant correctement des champs de bataille dans les tunnels, nous pourrons user le Balrog par un processus d’attrition constant. Des milliers mourront, mais c’est un sacrifice nécessaire pour détruire le dernier Balrog et libérer le monde de l’ombre !"
ee_arnor.4000.a:0 "Hommes, à vos positions !"

ee_arnor.8.t:0 "Pas de nouvelles du Nord"
ee_arnor.8.desc:0 "Nous n’avons encore reçu aucune nouvelle de la recherche des Palantíri perdus de l'Arnor. Nos meilleurs aventuriers poursuivent leur exploration de la baie de Forochel à la recherche du navire d’Arvedui. Tout ce qu’il nous reste à faire est d’attendre leurs résultats."
ee_arnor.8.a:0 "Nous attendons avec impatience leur succès."
ee_arnor.8.b:0 "Rappelez-les, nous ne pouvons pas nous permettre de continuer ainsi."

ee_arnor.9.t:0 "Un miracle gelé"
ee_arnor.9.desc:0 "Nous avons reçu un rapport absolument stupéfiant de nos aventuriers à Forochel. Ils ont découvert un navire numénoréen prisonnier d’un iceberg. L’embarquement fut problématique, mais une fois à l’intérieur, il était clair que le navire transportait quelqu’un d’important. L’équipage, encore étrangement conservé par la glace, portait de riches robes et des armes fines. Nos équipes extrayèrent les corps pour leur offrir des funérailles dignes de nos ancêtres et récupérèrent autant que possible les ornements et documents du navire. Puis ils poursuivirent la recherche des Palantíri perdus. Mais alors survint le miracle : un enfant, identifié dans les registres comme Ârûbên, neveu de Pharazôn, s’éveilla soudain. Gravement engourdi par le froid et incapable de se tenir debout, il était néanmoins vivant."
ee_arnor.9.a:0 "Amenez immédiatement l’héritier de Númenor à la capitale !"

ee_arnor.7.t:0 "La Pierre d’Osgiliath retrouvée !"
ee_arnor.7.desc:0 "Après de longs mois de dragage et plusieurs propositions pour détourner le fleuve, l’une de nos grues rencontra une grande pierre près des fondations d’un ancien pont. Au départ, nous pensions qu’il ne s’agissait que d’un rocher ordinaire. Mais à mesure que la masse émergeait de l’eau, sa forme devint évidente. Après quelques efforts de nettoyage et de polissage, nos soupçons furent confirmés : nous avions retrouvé le Palantír Maître d’Osgiliath !"
ee_arnor.7.a:0 "La Pierre-Maîtresse restaurée !"

ee_arnor.20.t:0 "Choisir un candidat"
ee_arnor.20.desc:0 "Maintenant que la décision d’envoyer une expédition en Arnor a été prise, il m’incombe, en tant que Intendant de Gondor, de choisir un leader digne de cette mission cruciale. Ce choix ne peut être fait à la légère, car la route vers le Nord est longue et périlleuse, et le destin de cette entreprise reposera lourdement sur celui qui la dirigera. Le leader doit posséder non seulement des compétences martiales et une sagesse stratégique, mais aussi la force de volonté pour supporter les épreuves du voyage et le poids de la responsabilité. Il doit être un modèle de loyauté envers Gondor, capable d’inspirer ses compagnons et de naviguer à travers les terres sauvages et les alliances incertaines qui attendent dans les vestiges de l’ancien royaume du Nord. En tant qu’Intendant, il est de mon devoir de m’assurer que nos espoirs ne reposent pas entre des mains fragiles, car le succès de cette expédition pourrait façonner l’avenir de Gondor et d’Arnor."
ee_arnor.20.a:0 "Mon chevalier, [candidate1.GetName] est à la hauteur !"
ee_arnor.20.a.tt:0 "[candidate1.GetName] se rendra en Arnor pour établir une nouvelle colonie"
ee_arnor.20.b:0 "Je confie cette mission à vous, [candidate2.GetFirstName]."
ee_arnor.20.b.tt:0 "[candidate2.GetFirstName] se rendra en Arnor pour établir une nouvelle colonie"
ee_arnor.20.c:0 "Je crois que [candidate3.GetName] est le mieux placé pour cette mission."
ee_arnor.20.c.tt:0 "[candidate3.GetName] se rendra en Arnor pour établir une nouvelle colonie"
ee_arnor.20.d:0 "C’est une tâche pour [faramir.GetFirstName], capitaine de Gondor !"
ee_arnor.20.d.tt:0 "[faramir.GetName] se rendra en Arnor pour établir une nouvelle colonie"

ee_arnor.21.t:0 "L’expédition s’assemble"
ee_arnor.21.desc:0 "En réponse à mon invitation récente à mener une expédition en Arnor, [arnorsettler.GetName] est arrivé à ma cour avec un petit groupe d’hommes aventureux.\n\nIls demandent combien d’or je suis prêt à investir pour coloniser [target_county.GetNameNoTier]. Si je les aide, leur nouveau royaume pourra croître beaucoup plus rapidement et devenir plus prospère…"
ee_arnor.21.a:0 "Je leur accorderai une somme généreuse."
ee_arnor.21.a.tt:0 "La nouvelle colonie disposera de deux bâtiments supplémentaires hautement développés"
ee_arnor.21.b:0 "Finançons-les correctement."
ee_arnor.21.b.tt:0 "La nouvelle colonie disposera de deux bâtiments supplémentaires"
ee_arnor.21.c:0 "Ils auront une partie de mon excédent d’or."
ee_arnor.21.c.tt:0 "La nouvelle colonie disposera d’un bâtiment supplémentaire"
ee_arnor.21.d:0 "Je crains de ne pouvoir rien accorder pour le moment."
ee_arnor.21.d.tt:0 "La nouvelle colonie n’aura pas de bâtiment supplémentaire"
 
 ee_arnor.23.t:0 "Girithlin Colonisée"
ee_arnor.23.desc:0 "De réjouissantes nouvelles me parviennent de la colonie en Arnor que j’ai parrainée. La construction est terminée, et le nouvel établissement de [target_county.GetNameNoTier] est achevé !\n\nLe nouveau seigneur, [arnorsettler.GetName], a pris possession de ce fief, et les Dúnedain ont commencé à étendre leur nouveau domaine avec diligence. Que [ROOT.Char.GetFaith.HighGodName] leur accorde succès et prospérité dans leurs entreprises !"
ee_arnor.23.a:0 "Bonne chance à notre colonie !"
ee_arnor.23.a.tt:0 "Vous gagnez une [defensive_alliance|e] avec [arnorsettler.GetName]"
ee_arnor.23.b:0 "Espérons qu'ils ne nous en voudront pas d'avoir refusé des fonds..."
ee_arnor.23.c:0 "Je me demande ce que [arnorsettler.GetFirstName] fera ensuite…"

ee_arnor.24.t:0 "Girithlin Colonisée"
ee_arnor.24.desc:0 "Notre colonisation de Girithlin a dépassé nos espérances les plus ambitieuses, progressant avec une rapidité et un succès que peu pouvaient prévoir. Ce qui avait commencé comme un modeste avant-poste autour de l’ancienne tour s’est rapidement transformé en un domaine florissant, nos habitants s’étendant sur toute la région. La terre, jadis sauvage et indomptée, porte désormais la marque de notre établissement, des villages surgissent le long des rivières, des routes traversent les forêts denses, et les champs sont cultivés pour offrir leurs richesses. Nos ingénieurs ont restauré l’ancienne tour dans toute sa splendeur, non pas comme relique du passé, mais comme symbole de notre légitime domination sur ces terres. Le commerce prospère, et nos défenses se renforcent chaque jour. Les habitants de Girithlin ne se considèrent plus comme de simples colons, mais comme les véritables gardiens de cette terre, forgeant un nouveau chapitre dans son histoire longue et légendaire. Cependant, en célébrant nos succès, nous devons rester vigilants : la nature sauvage au-delà de nos frontières recèle encore des secrets, et tous ceux qui habitaient ces terres autrefois ne verront pas notre présence d’un bon œil."
ee_arnor.24.a:0 "D’abord Girithlin, puis le Cardolan, puis tout l'Arnor !"

ee_arnor.30.t:0 "Le Roi d’Arnor ?"
ee_arnor.30.desc:0 "Maintenant que nous avons sécurisé une grande partie de l’ancien royaume d’Arnor, il est temps d’en restaurer l’ancienne gloire en couronnant un roi. Les terres autrefois en ruine ont été reconquises, le peuple unifié sous un objectif commun, et l’héritage noble d’Arnor commence à se réveiller dans le cœur de ses habitants. La stabilité revenant dans la région et l’ombre du chaos reculant, la nécessité d’un souverain fort et légitime n’a jamais été aussi pressante. Une couronne doit être posée sur une tête digne—celle d’un dirigeant capable de guider Arnor avec sagesse, courage et vision, vers une nouvelle ère de paix et de prospérité."
ee_arnor.30.a:0 "Je suis le restaurateur du royaume, il est juste que je monte sur le trône."
ee_arnor.30.a.tt:0 "[candidate1.GetFirstName] montera sur le trône"
ee_arnor.30.b:0 "Je confie cette charge à vous, [candidate2.GetFirstName]."
ee_arnor.30.b.tt:0 "[candidate2.GetFirstName] montera sur le trône"
ee_arnor.30.c:0 "Je crois que [candidate3.GetName] est le mieux placé pour cette tâche."
ee_arnor.30.c.tt:0 "[candidate3.GetName] montera sur le trône"
ee_arnor.30.d:0 "Je crois que [candidate4.GetName] est le meilleur choix."
ee_arnor.30.d.tt:0 "[candidate4.GetName] montera sur le trône"
ee_arnor.30.e:0 "Il est temps que les royaumes soient réunis !"
ee_arnor.30.e.tt:0 "Vous deviendrez vassal de Gondor"

ee_arnor.31.t:0 "Le Retour du Roi ?"
ee_arnor.31.desc:0 "Je n’aurais jamais imaginé que ce jour viendrait—pas vraiment. Lorsque l’expédition gondorienne marcha vers le nord, je pensais seulement à aider à la reconquête des ruines de l'Arnor, honorant la mémoire d’un royaume perdu dans le temps et l’ombre. Pourtant maintenant, après des mois de victoires âprement disputées et de reconstruction infatigable, ils se tiennent devant moi avec des yeux solennels et m’offrent l’impensable : le trône d’Arnor. Moi un homme à la lignée effacée, mentionnée dans de vieux livres et chansons à demi oubliées. Pourtant je ne suis pas seul, d’autres possèdent un sang qui pourrait légitimer la couronne, tous des vestiges dispersés d’une noble lignée plongée dans le silence depuis des siècles. Pourtant, ils se tournent vers moi, peut-être pour mes choix, la confiance que j’ai gagnée, ou la manière dont je suis resté inébranlable tandis que le royaume se réveillait. Et maintenant, je dois décider si je prendrai ce fardeau ancien, et devenir quelque chose de plus qu’une ombre du passé—quelque chose digne du trône lui-même."
ee_arnor.31.a:0 "Salut au Retour du Roi !"
ee_arnor.31.a.tt:0 "Je prendrai le trône"
ee_arnor.31.b:0 "Je ne suis pas le bon candidat…"
ee_arnor.31.b.tt:0 "[arnorsteward.GetFirstName] choisira un autre candidat"

ee_arnor.32.t:0 "Notre colonie jure fidélité"
ee_arnor.32.desc:0 "La colonie que nous avons envoyée en Arnor a prospéré au-delà de nos espérances, se transformant d’un avant-poste fragile en une forteresse florissante qui détient désormais une grande partie du Royaume du Nord jadis perdu. Par la persévérance, la sagesse et la force de son peuple, la colonie a su stabiliser la région sauvage et les ruines, ravivant l’esprit ancien d’Arnor. Face à ce succès remarquable, le Steward du Nord déclare qu’il est temps pour le Royaume du Nord de revenir dans le giron du royaume—non pas comme un fragment dispersé ou une province oubliée, mais comme un royaume renouvelé, digne de son passé légendaire. C’est un appel non seulement à la gouvernance, mais à l’unité, l’héritage et la restauration d’un royaume longtemps considéré comme perdu dans la légende."
ee_arnor.32.a:0 "Il est temps que les royaumes soient réunis."
ee_arnor.32.a.tt:0 "[arnorsteward.GetFirstName] deviendra votre vassal"
ee_arnor.32.b:0 "Le moment n’est pas encore venu."
ee_arnor.32.b.tt:0 "[arnorsteward.GetFirstName] restera indépendant"
  
 ### Angmar 
 
 ee_arnor.10.t:0 "Le Retour d’Angmar"
ee_arnor.10.desc:0 "La volonté du Seigneur Noir pressait mon esprit, un appel à la fois irréfutable et absolu. Je me suis agenouillé devant le grand œil sans paupière, enveloppé d’ombre, attendant son ordre. Arnor s’est relevé de sa tombe, la voix de Sauron grondant dans mon crâne, un murmure de malice et d’acier. Ses rois s’enhardissent. Son peuple oublie son destin funeste. Va, mon lieutenant. Va en Angmar, et rappelle-leur leur sort. Un frisson de puissance me parcourut, ravivant le sombre dominion que j’avais autrefois exercé. Le Nord avait dormi trop longtemps en l’absence de son vrai maître. Les vents glacés de Carn Dûm hurleraient à mon retour, et par eux, la peur se répandrait comme un gel rampant. Les royaumes des hommes, si insensés dans leur restauration, apprendraient qu’aucun royaume né de vieilles ruines ne peut résister à la colère du Roi-Sorcier.\n\nLorsque je me relevai de mon hommage, les forges de Barad-dûr rugirent, et mon destrier m’attendait, ses yeux brûlant de la même flamme glaciale qui animait mon corps. Les étendards d’Angmar se lèveraient à nouveau, et avec eux, la nuit. Je rassemblerais les vestiges des anciennes bandes de guerre, invoquerais les esprits errant dans les tumulus et lèverais de nouvelles légions des terres glacées. Le Nord avait toujours été mien, et désormais, par décret de mon maître, il le serait à nouveau. Les fils d’Arnor trembleraient à mon approche, et leurs rois, aussi nobles soient-ils, chancelleraient comme leurs ancêtres avant eux. Sauron a parlé. J’obéirai."
ee_arnor.10.a:0 "Mon Seigneur commande"
ee_arnor.10.b:0 "Nous lui souhaitons bonne chance. (Continuer à Mordor)"

ee_arnor.11.t: "Le retour du Roi-Sorcier en Angmar !"
ee_arnor.11.desc: "Avec la renaissance d’Arnor, le Roi-Sorcier d’Angmar s’est éveillé des ombres de la légende et a quitté sa sombre forteresse. Après des siècles de silence, sa présence se répand à nouveau dans les vents du Nord, apportant avec elle une terreur renouvelée. L’ancien ennemi, jadis vaincu et relégué dans l’oubli, est revenu avec un objectif précis : reconquérir ce qui fut perdu et éteindre l’étincelle d’espoir qui ose encore brûler dans le cœur des hommes. Son regard se tourne vers les vestiges brisés du Nord, où tremblent les anciennes alliances et où la lignée des rois s’élevait autrefois fièrement.\n\nMais cette fois, le Roi-Sorcier ne revient pas comme une simple ombre de lui-même. Renforcé par des sorcelleries plus profondes et plus sombres, et mû par une vengeance ayant mûri au fil des âges, il ne vise pas seulement la chute d’Arnor, mais l’anéantissement total de son héritage. Ses armées se rassemblent dans le secret, des créatures ténébreuses émergent de lieux oubliés, et la terre elle-même semble gémir sous le poids de son retour. Ce qu’il avait commencé autrefois, guerre, ruine et domination, il entend désormais l’achever, et sans une nouvelle union des peuples libres, le Nord pourrait bien sombrer sous une seconde ombre, plus impitoyable encore."

ee_arnor.11.b: "Le Roi-Sorcier revient pour réclamer son juste domaine !"
ee_arnor.11.a: "Nous réussirons là où nos ancêtres ont échoué."
ee_arnor.11.c: "Que ruine ou renaissance en découle, seul le temps le dira."

